<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - FRP 面板</title>
    <link rel="stylesheet" href="/web/style.css?v=__ASSET_VERSION__" />
  </head>
  <body data-page="login" data-asset-version="__ASSET_VERSION__">
    <header class="site-header">
      <div class="brand">
        <h1>FRP 面板</h1>
        <p>登录后继续管理</p>
        <div class="brand-meta">
          <span class="ui-version-badge">Login</span>
          <span class="brand-meta-text">单用户安全入口</span>
        </div>
      </div>
      <div></div>
      <div class="head-actions">
        <select id="theme_mode" class="theme-select" aria-label="主题模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色主题</option>
          <option value="dark">深色主题</option>
        </select>
      </div>
    </header>

    <main class="login-shell reveal">
      <section class="login-card">
        <h1>账号登录</h1>
        <p class="login-desc">请输入用户名与密码进入控制台。</p>
        <form id="login_form" method="post" action="/api/auth/login-form">
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
          </div>
          <div class="actions two">
            <button id="login_btn" type="submit" class="btn primary">
              <svg class="btn-icon" aria-hidden="true"><use href="/web/icons.svg#icon-login"></use></svg>
              <span class="btn-label">登录</span>
            </button>
          </div>
        </form>
        <p id="login_error" class="hint error"></p>
        <p class="login-tip">仅记录用户名，不会在浏览器保存密码。</p>
      </section>
    </main>
    <script src="/web/shared.js?v=__ASSET_VERSION__" type="module"></script>
    <script src="/web/login.js?v=__ASSET_VERSION__" type="module"></script>
  </body>
</html>
