<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运行事件 - FRP 面板</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body data-page="events">
    <header class="site-header">
      <div class="brand">
        <h1>FRP 面板</h1>
        <p>运行事件诊断</p>
      </div>
      <nav class="nav-tabs" aria-label="主导航">
        <a href="/" data-nav="dashboard">控制台</a>
        <a href="/events" data-nav="events">运行事件</a>
        <a href="/alerts" data-nav="alerts">告警设置</a>
        <a href="/maintenance" data-nav="maintenance">维护工具</a>
      </nav>
      <div class="head-actions">
        <select id="theme_mode" class="theme-select" aria-label="主题模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色主题</option>
          <option value="dark">深色主题</option>
        </select>
        <span id="user_badge" class="user-badge">未登录</span>
        <button id="logout_btn" class="btn danger small">退出登录</button>
      </div>
    </header>

    <main class="single-page reveal">
      <section class="panel">
        <div class="panel-head">
          <h2>事件流</h2>
          <button id="events_refresh_btn" class="btn secondary small">刷新</button>
        </div>
        <div class="filters sticky-filters">
          <div class="field">
            <label for="events_client">客户端</label>
            <select id="events_client"></select>
          </div>
          <div class="field">
            <label for="events_type">事件类型</label>
            <select id="events_type">
              <option value="">全部</option>
              <option value="manual_stop">manual_stop</option>
              <option value="normal_exit">normal_exit</option>
              <option value="abnormal_exit">abnormal_exit</option>
              <option value="start_failure">start_failure</option>
              <option value="auto_restart">auto_restart</option>
              <option value="alert_sent">alert_sent</option>
              <option value="alert_failed">alert_failed</option>
              <option value="preflight_failed">preflight_failed</option>
              <option value="preflight_forced">preflight_forced</option>
            </select>
          </div>
          <div class="field">
            <label for="events_sort">排序</label>
            <select id="events_sort">
              <option value="desc">最新优先</option>
              <option value="asc">最早优先</option>
            </select>
          </div>
        </div>
        <div id="events_list" class="events-list"></div>
        <p id="events_hint" class="hint info"></p>
      </section>
    </main>
    <script src="/web/shared.js" type="module"></script>
    <script src="/web/events.js" type="module"></script>
  </body>
</html>
