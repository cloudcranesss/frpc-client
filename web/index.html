<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRP 主页</title>
    <link rel="stylesheet" href="/web/style.css?v=__ASSET_VERSION__" />
  </head>
  <body data-page="home" data-asset-version="__ASSET_VERSION__">
    <header class="site-header">
      <div class="brand">
        <h1>FRP 面板</h1>
        <p>成功穿透站点聚合</p>
      </div>
      <nav class="nav-tabs" aria-label="主导航">
        <a href="/" data-nav="home">主页</a>
        <a href="/console" data-nav="console">控制台</a>
        <a href="/settings" data-nav="settings">设置</a>
      </nav>
      <div class="head-actions">
        <select id="theme_mode" class="theme-select" aria-label="主题模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色主题</option>
          <option value="dark">深色主题</option>
        </select>
        <span id="user_badge" class="user-badge">未登录</span>
        <button id="logout_btn" class="btn danger small">
          <svg class="btn-icon" aria-hidden="true"><use href="/web/icons.svg#icon-logout"></use></svg>
          <span class="btn-label">退出登录</span>
        </button>
      </div>
    </header>

    <main class="single-page sites-page">
      <section class="panel reveal">
        <div class="panel-head">
          <h2>已成功穿透站点</h2>
          <button id="sites_refresh_btn" class="btn secondary small">
            <svg class="btn-icon" aria-hidden="true"><use href="/web/icons.svg#icon-refresh"></use></svg>
            <span class="btn-label">刷新</span>
          </button>
        </div>
        <p class="hint info">仅展示 HTTP/HTTPS 且探活返回 2xx/3xx 的站点。</p>
        <div id="sites_summary" class="sites-summary">加载中...</div>
        <div id="sites_list" class="sites-list">
          <div class="jump-empty">正在获取站点数据...</div>
        </div>
        <p id="sites_hint" class="hint info"></p>
      </section>
    </main>

    <script src="/web/shared.js?v=__ASSET_VERSION__" type="module"></script>
    <script src="/web/sites.js?v=__ASSET_VERSION__" type="module"></script>
  </body>
</html>
