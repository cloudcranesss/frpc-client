services:
  frp-web-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: frp-web-client:latest
    container_name: frp-web-client
    restart: unless-stopped
    network_mode: host
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port $${FRP_PANEL_PORT:-8000} --workers 1"]
    environment:
      - FRP_PANEL_SECURE_COOKIE=false
      - FRP_PANEL_PORT=8000
      - FRP_PANEL_ASSET_VERSION=${FRP_PANEL_ASSET_VERSION:-20260505-1}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${FRP_PANEL_PORT:-8000}/api/auth/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
